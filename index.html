<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매출 분석 대시보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx 파일 읽기용) -->

    <style>

            height: 6px;

</head>
<body class="text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

                <div class="bg-indigo-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-chart-line text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">매출 실적 분석 대시보드</h1>

            <div class="flex items-center space-x-2">

                    <i class="fa-solid fa-database mr-1"></i> 샘플 데이터 로드

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <section class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                <!-- 날짜 범위 선택기 -->
                <div class="flex items-center space-x-1.5">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">시작일</label>
                        <input type="date" id="startDateFilter" class="bg-slate-50 border border-slate-300 text-slate-900 text-xs rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2">
                    </div>
                    <span class="text-slate-400 self-end pb-2 font-bold">~</span>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">종료일</label>
                        <input type="date" id="endDateFilter" class="bg-slate-50 border border-slate-300 text-slate-900 text-xs rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">점포 선택</label>
                    <select id="storeFilter" class="bg-slate-50 border border-slate-300 text-slate-900 text-xs rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2">
                        <option value="ALL">전체 점포</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">카테고리</label>
                    <select id="categoryFilter" class="bg-slate-50 border border-slate-300 text-slate-900 text-xs rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2">
                        <option value="ALL">전체 카테고리</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">행사 적용</label>
                    <select id="promoFilter" class="bg-slate-50 border border-slate-300 text-slate-900 text-xs rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2">
                        <option value="ALL">전체 (Y/N)</option>
                        <option value="Y">행사 적용 (Y)</option>

            <div class="flex items-center space-x-2 text-xs text-slate-500">

        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- 총 매출액 -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">

                </div>
            </div>
            <!-- 총 판매수량 -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500">총 판매수량</p>
                    <h3 class="text-xl font-bold text-slate-900 mt-1" id="kpiTotalQuantity">0개</h3>
                </div>
                <div class="p-3 bg-blue-50 text-blue-600 rounded-xl">
                    <i class="fa-solid fa-box text-xl"></i>
                </div>
            </div>
            <!-- 총 할인액 -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-500">총 할인금액</p>
                    <h3 class="text-xl font-bold text-slate-900 mt-1" id="kpiTotalDiscount">₩0</h3>
                </div>
                <div class="p-3 bg-rose-50 text-rose-600 rounded-xl">
                    <i class="fa-solid fa-tags text-xl"></i>
                </div>
            </div>
            <!-- 행사 매출 비중 -->

                <div>
                    <p class="text-xs font-medium text-slate-500">행사 상품 비중</p>
                    <h3 class="text-xl font-bold text-slate-900 mt-1" id="kpiPromoRatio">0%</h3>
                </div>
                <div class="p-3 bg-amber-50 text-amber-600 rounded-xl">
                    <i class="fa-solid fa-percent text-xl"></i>

        </section>

        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 점포별 매출 현황 -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center justify-between">
                    <span><i class="fa-solid fa-store mr-2 text-indigo-500"></i>점포별 매출 비중</span>
                </h2>
                <div class="h-64 relative flex items-center justify-center">
                    <canvas id="storeChart"></canvas>
                </div>
            </div>

            <!-- 카테고리별 매출 현황 -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center justify-between">
                    <span><i class="fa-solid fa-layer-group mr-2 text-indigo-500"></i>카테고리별 매출 현황</span>
                </h2>
                <div class="h-64 relative">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <!-- Top 5 매출 상품 -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center justify-between">
                    <span><i class="fa-solid fa-trophy mr-2 text-indigo-500"></i>매출 Top 5 상품</span>
                </h2>
                <div class="h-64 relative">
                    <canvas id="topProductsChart"></canvas>
                </div>
            </div>

            <!-- 행사 적용 여부 비교 -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="text-sm font-bold text-slate-800 mb-4 flex items-center justify-between">
                    <span><i class="fa-solid fa-bullhorn mr-2 text-indigo-500"></i>행사 적용 여부별 비교</span>
                </h2>
                <div class="h-64 relative">
                    <canvas id="promoChart"></canvas>
                </div>
            </div>
        </section>

        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
                <h2 class="text-sm font-bold text-slate-800">
                    <i class="fa-solid fa-table-list mr-2 text-indigo-500"></i>상세 판매 데이터
                </h2>
                <div class="flex items-center space-x-2">
                    <input type="text" id="searchInput" placeholder="상품명 또는 코드 검색..." class="bg-slate-50 border border-slate-300 text-xs rounded-lg px-3 py-1.5 focus:ring-indigo-500 focus:border-indigo-500 w-48">
                    <button id="exportCsvBtn" class="px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition">
                        <i class="fa-solid fa-download mr-1"></i> 내보내기
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto max-h-96 custom-scrollbar">
                <table class="w-full text-xs text-left text-slate-600">
                    <thead class="text-xs text-slate-700 uppercase bg-slate-50 sticky top-0 border-b border-slate-200">
                        <tr>
                            <th scope="col" class="px-4 py-3">일자</th>
                            <th scope="col" class="px-4 py-3">점포</th>
                            <th scope="col" class="px-4 py-3">카테고리</th>
                            <th scope="col" class="px-4 py-3">상품코드</th>
                            <th scope="col" class="px-4 py-3">상품명</th>
                            <th scope="col" class="px-4 py-3 text-right">판매수량</th>
                            <th scope="col" class="px-4 py-3 text-right">정상단가</th>
                            <th scope="col" class="px-4 py-3 text-right">할인액</th>
                            <th scope="col" class="px-4 py-3 text-right">매출액</th>
                            <th scope="col" class="px-4 py-3 text-center">행사적용</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // Default Sample Data (With YYYY-MM-DD formatted dates)
        const sampleData = [
            { 일자: '2026-10-15', 점포: '센트럴점', 카테고리: '냉장 간편식', 상품코드: 'RM-101', 상품명: '한끼 소불고기', 판매수량: 44, 정상단가: 5900, 할인액: 0, 매출액: 259600, 행사적용: 'N' },
            { 일자: '2026-10-15', 점포: '센트럴점', 카테고리: '냉장 간편식', 상품코드: 'RM-102', 상품명: '매콤 닭갈비', 판매수량: 49, 정상단가: 5500, 할인액: 0, 매출액: 269500, 행사적용: 'N' },
            { 일자: '2026-10-14', 점포: '센트럴점', 카테고리: '냉동 식품', 상품코드: 'FM-201', 상품명: '바삭 군만두 1kg', 판매수량: 65, 정상단가: 8900, 할인액: 89000, 매출액: 489500, 행사적용: 'Y' },
            { 일자: '2026-10-14', 점포: '강남점', 카테고리: '냉장 간편식', 상품코드: 'RM-101', 상품명: '한끼 소불고기', 판매수량: 80, 정상단가: 5900, 할인액: 0, 매출액: 472000, 행사적용: 'N' },
            { 일자: '2026-10-13', 점포: '강남점', 카테고리: '신선 식품', 상품코드: 'FF-301', 상품명: '유기농 세척사과', 판매수량: 30, 정상단가: 12000, 할인액: 36000, 매출액: 324000, 행사적용: 'Y' },
            { 일자: '2026-10-12', 점포: '홍대점', 카테고리: '음료/주류', 상품코드: 'DR-401', 상품명: '제로 스파클링 500ml', 판매수량: 120, 정상단가: 2000, 할인액: 24000, 매출액: 216000, 행사적용: 'Y' },
            { 일자: '2026-10-11', 점포: '홍대점', 카테고리: '냉장 간편식', 상품코드: 'RM-103', 상품명: '치즈 김치볶음밥', 판매수량: 52, 정상단가: 4800, 할인액: 0, 매출액: 249600, 행사적용: 'N' },
            { 일자: '2026-10-10', 점포: '센트럴점', 카테고리: '음료/주류', 상품코드: 'DR-402', 상품명: '콜드브루 라떼', 판매수량: 75, 정상단가: 3500, 할인액: 0, 매출액: 262500, 행사적용: 'N' }
        ];

        let rawData = [...sampleData];
        let filteredData = [...sampleData];

        // Chart instances
        let storeChartInstance = null;
        let categoryChartInstance = null;
        let topProductsChartInstance = null;
        let promoChartInstance = null;

        // Date formatting utility to YYYY-MM-DD
        function formatDate(val) {
            if (!val) return '-';
            
            // Excel serial date number conversion
            if (typeof val === 'number') {
                const dateObj = XLSX.SSF.parse_date_code(val);
                if (dateObj) {
                    const y = dateObj.y;
                    const m = String(dateObj.m).padStart(2, '0');
                    const d = String(dateObj.d).padStart(2, '0');
                    return `${y}-${m}-${d}`;
                }
            }

            const strVal = String(val).trim();
            // Handle YYYYMMDD
            if (/^\d{8}$/.test(strVal)) {
                return `${strVal.slice(0,4)}-${strVal.slice(4,6)}-${strVal.slice(6,8)}`;
            }

            // Standard Date object attempt
            const parsed = new Date(strVal);
            if (!isNaN(parsed.getTime())) {
                const y = parsed.getFullYear();
                const m = String(parsed.getMonth() + 1).padStart(2, '0');
                const d = String(parsed.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            return strVal;
        }

        // Initialize application
        window.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            initDashboard();
        });

        function setupEventListeners() {
            document.getElementById('fileInput').addEventListener('change', handleFileUpload);
            document.getElementById('loadSampleBtn').addEventListener('click', () => {
                rawData = [...sampleData];
                initDashboard();
            });

            document.getElementById('startDateFilter').addEventListener('change', applyFilters);
            document.getElementById('endDateFilter').addEventListener('change', applyFilters);
            document.getElementById('storeFilter').addEventListener('change', applyFilters);
            document.getElementById('categoryFilter').addEventListener('change', applyFilters);
            document.getElementById('promoFilter').addEventListener('change', applyFilters);
            document.getElementById('searchInput').addEventListener('input', applyFilters);
            document.getElementById('exportCsvBtn').addEventListener('click', exportToCSV);
        }

        // Parse Excel/CSV File
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { raw: true });

                    // Normalize Keys & Formats
                    rawData = json.map(row => ({
                        일자: formatDate(row['일자'] || row['Date']),
                        점포: row['점포'] || row['Store'] || '미지정',
                        카테고리: row['카테고리'] || row['Category'] || '기타',
                        상품코드: row['상품코드'] || row['Code'] || '-',
                        상품명: row['상품명'] || row['Name'] || '-',
                        판매수량: Number(row['판매수량'] || row['Qty'] || 0),
                        정상단가: Number(row['정상단가'] || row['Price'] || 0),
                        할인액: Number(row['할인액'] || row['Discount'] || 0),
                        매출액: Number(row['매출액'] || row['Amount'] || 0),
                        행사적용: String(row['행사적용'] || row['Promo'] || 'N').toUpperCase()
                    }));

                    populateFilterOptions();
                    applyFilters();
                } catch (err) {
                    alert('파일을 읽는 중 오류가 발생했습니다. 올바른 엑셀/CSV 형식인지 확인해 주세요.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // Initialize Filters & Views
        function initDashboard() {
            populateFilterOptions();
            applyFilters();
        }

        function populateFilterOptions() {
            const stores = [...new Set(rawData.map(d => d.점포))];
            const categories = [...new Set(rawData.map(d => d.카테고리))];

            const storeSelect = document.getElementById('storeFilter');
            const categorySelect = document.getElementById('categoryFilter');

            storeSelect.innerHTML = '<option value="ALL">전체 점포</option>' + stores.map(s => `<option value="${s}">${s}</option>`).join('');
            categorySelect.innerHTML = '<option value="ALL">전체 카테고리</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');

            // Automatically set Min/Max dates
            const dates = rawData.map(d => d.일자).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
            if (dates.length > 0) {
                document.getElementById('startDateFilter').value = dates[0];
                document.getElementById('endDateFilter').value = dates[dates.length - 1];
            } else {
                document.getElementById('startDateFilter').value = '';
                document.getElementById('endDateFilter').value = '';
            }
        }

        // Filter Logic
        function applyFilters() {
            const startDate = document.getElementById('startDateFilter').value;
            const endDate = document.getElementById('endDateFilter').value;
            const storeVal = document.getElementById('storeFilter').value;
            const categoryVal = document.getElementById('categoryFilter').value;
            const promoVal = document.getElementById('promoFilter').value;
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

            filteredData = rawData.filter(item => {
                const matchStart = !startDate || item.일자 >= startDate;
                const matchEnd = !endDate || item.일자 <= endDate;
                const matchStore = storeVal === 'ALL' || item.점포 === storeVal;
                const matchCategory = categoryVal === 'ALL' || item.카테고리 === categoryVal;
                const matchPromo = promoVal === 'ALL' || item.행사적용 === promoVal;
                const matchSearch = !searchVal || 
                    String(item.상품명).toLowerCase().includes(searchVal) || 
                    String(item.상품코드).toLowerCase().includes(searchVal);

                return matchStart && matchEnd && matchStore && matchCategory && matchPromo && matchSearch;
            });

            updateKPIs();
            updateCharts();
            updateTable();
        }

        function updateKPIs() {
            const totalRevenue = filteredData.reduce((acc, curr) => acc + curr.매출액, 0);
            const totalQuantity = filteredData.reduce((acc, curr) => acc + curr.판매수량, 0);
            const totalDiscount = filteredData.reduce((acc, curr) => acc + curr.할인액, 0);
            
            const promoCount = filteredData.filter(d => d.행사적용 === 'Y').length;
            const promoRatio = filteredData.length > 0 ? ((promoCount / filteredData.length) * 100).toFixed(1) : 0;

            document.getElementById('kpiTotalRevenue').innerText = '₩' + totalRevenue.toLocaleString();
            document.getElementById('kpiTotalQuantity').innerText = totalQuantity.toLocaleString() + '개';
            document.getElementById('kpiTotalDiscount').innerText = '₩' + totalDiscount.toLocaleString();
            document.getElementById('kpiPromoRatio').innerText = promoRatio + '%';
            document.getElementById('dataCount').innerText = filteredData.length;
        }

        function updateCharts() {
            renderStoreChart();
            renderCategoryChart();
            renderTopProductsChart();
            renderPromoChart();
        }

        function renderStoreChart() {
            const ctx = document.getElementById('storeChart').getContext('2d');
            const storeTotals = {};
            filteredData.forEach(d => {
                storeTotals[d.점포] = (storeTotals[d.점포] || 0) + d.매출액;
            });

            if (storeChartInstance) storeChartInstance.destroy();
            storeChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(storeTotals),
                    datasets: [{
                        data: Object.values(storeTotals),
                        backgroundColor: ['#6366f1', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        function renderCategoryChart() {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            const categoryTotals = {};
            filteredData.forEach(d => {
                categoryTotals[d.카테고리] = (categoryTotals[d.카테고리] || 0) + d.매출액;
            });

            if (categoryChartInstance) categoryChartInstance.destroy();
            categoryChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(categoryTotals),
                    datasets: [{
                        label: '매출액 (원)',
                        data: Object.values(categoryTotals),
                        backgroundColor: '#818cf8',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        function renderTopProductsChart() {
            const ctx = document.getElementById('topProductsChart').getContext('2d');
            const productTotals = {};
            filteredData.forEach(d => {
                productTotals[d.상품명] = (productTotals[d.상품명] || 0) + d.매출액;
            });

            const sorted = Object.entries(productTotals)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            if (topProductsChartInstance) topProductsChartInstance.destroy();
            topProductsChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sorted.map(item => item[0]),
                    datasets: [{
                        label: '매출액',
                        data: sorted.map(item => item[1]),
                        backgroundColor: '#34d399',
                        borderRadius: 6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true } }
                }
            });
        }

        function renderPromoChart() {
            const ctx = document.getElementById('promoChart').getContext('2d');
            let promoSales = 0;
            let normalSales = 0;

            filteredData.forEach(d => {
                if (d.행사적용 === 'Y') promoSales += d.매출액;
                else normalSales += d.매출액;
            });

            if (promoChartInstance) promoChartInstance.destroy();
            promoChartInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['행사 적용 (Y)', '일반 판매 (N)'],
                    datasets: [{
                        data: [promoSales, normalSales],
                        backgroundColor: ['#fbbf24', '#94a3b8']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        function updateTable() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center py-6 text-slate-400">조회된 데이터가 없습니다.</td></tr>`;
                return;
            }

            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-slate-100 hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="px-4 py-3 font-mono">${row.일자}</td>
                    <td class="px-4 py-3 font-medium text-slate-800">${row.점포}</td>
                    <td class="px-4 py-3">${row.카테고리}</td>
                    <td class="px-4 py-3 font-mono text-slate-500">${row.상품코드}</td>
                    <td class="px-4 py-3 font-medium text-slate-800">${row.상품명}</td>
                    <td class="px-4 py-3 text-right">${row.판매수량.toLocaleString()}</td>
                    <td class="px-4 py-3 text-right">₩${row.정상단가.toLocaleString()}</td>
                    <td class="px-4 py-3 text-right text-rose-500">₩${row.할인액.toLocaleString()}</td>
                    <td class="px-4 py-3 text-right font-bold text-slate-900">₩${row.매출액.toLocaleString()}</td>
                    <td class="px-4 py-3 text-center">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${row.행사적용 === 'Y' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600'}">
                            ${row.행사적용}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportToCSV() {
            if (filteredData.length === 0) {
                alert('내보낼 데이터가 없습니다.');
                return;
            }

            const headers = ['일자', '점포', '카테고리', '상품코드', '상품명', '판매수량', '정상단가', '할인액', '매출액', '행사적용'];
            const rows = filteredData.map(d => [
                d.일자, d.점포, d.카테고리, d.상품코드, `"${d.상품명}"`, d.판매수량, d.정상단가, d.할인액, d.매출액, d.행사적용
            ]);

            const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `sales_report_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
